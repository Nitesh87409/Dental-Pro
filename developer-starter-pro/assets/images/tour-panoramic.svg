<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <!-- Background gradient representing clinic walls -->
  <defs>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="chair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Room Walls -->
  <rect width="1200" height="300" fill="url(#wall-grad)" />
  <!-- Room Floor -->
  <rect y="300" width="1200" height="150" fill="url(#floor-grad)" />
  <!-- Division line / Baseboard -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#64748b" stroke-width="4" />

  <!-- Grid Perspective Lines on Floor -->
  <line x1="0" y1="450" x2="400" y2="300" stroke="#94a3b8" stroke-width="2" opacity="0.4" />
  <line x1="600" y1="450" x2="600" y2="300" stroke="#94a3b8" stroke-width="2" opacity="0.4" />
  <line x1="1200" y1="450" x2="800" y2="300" stroke="#94a3b8" stroke-width="2" opacity="0.4" />

  <!-- Modern Dental Operatory Chair (Center-Left) -->
  <g transform="translate(450, 180)">
    <!-- Base -->
    <path d="M 50 150 L 150 150 L 120 120 L 80 120 Z" fill="#475569" />
    <rect x="90" y="80" width="20" height="40" fill="#64748b" />
    <!-- Seat & Support structure -->
    <path d="M 40 80 Q 80 80 120 70 T 220 110" stroke="#334155" stroke-width="8" fill="none"/>
    <!-- Cushions (Teal) -->
    <!-- Headrest -->
    <rect x="30" y="35" width="25" height="15" rx="5" fill="url(#chair-grad)" />
    <!-- Backrest -->
    <path d="M 45 50 L 90 65 Q 95 75 90 85 L 60 80 Z" fill="url(#chair-grad)" />
    <!-- Seat Cushion -->
    <path d="M 90 75 L 170 70 C 180 70 190 90 180 95 L 100 90 Z" fill="url(#chair-grad)" />
    <!-- Dental Light Over the Chair -->
    <path d="M 100 80 L 100 -50 L 50 -70 L 50 -55" stroke="#94a3b8" stroke-width="5" fill="none" />
    <ellipse cx="50" cy="-55" rx="15" ry="8" fill="#fef08a" stroke="#64748b" stroke-width="2" />
    <path d="M 50 -55 L 80 100" stroke="#fef08a" stroke-width="2" opacity="0.15" stroke-dasharray="5,5" fill="none" />
  </g>

  <!-- Large Window with City / Garden view (Right) -->
  <g transform="translate(850, 40)">
    <!-- Window Frame -->
    <rect width="250" height="180" fill="#e0f2fe" stroke="#475569" stroke-width="6" />
    <!-- Window Panes -->
    <line x1="125" y1="0" x2="125" y2="180" stroke="#475569" stroke-width="4" />
    <line x1="0" y1="90" x2="250" y2="90" stroke="#475569" stroke-width="4" />
    <!-- Simple Tree Illustration outside -->
    <circle cx="60" cy="140" r="35" fill="#10b981" opacity="0.7"/>
    <rect x="55" y="140" width="10" height="40" fill="#78350f" opacity="0.7"/>
    <circle cx="190" cy="130" r="25" fill="#10b981" opacity="0.7"/>
    <rect x="187" y="130" width="6" height="50" fill="#78350f" opacity="0.7"/>
  </g>

  <!-- Cabinet & Sink Unit (Left) -->
  <g transform="translate(50, 160)">
    <rect x="0" y="60" width="220" height="80" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Countertop -->
    <rect x="-10" y="50" width="240" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- Drawers -->
    <line x1="110" y1="60" x2="110" y2="140" stroke="#94a3b8" stroke-width="2" />
    <rect x="20" y="75" width="70" height="15" rx="3" fill="#e2e8f0" />
    <rect x="20" y="105" width="70" height="15" rx="3" fill="#e2e8f0" />
    <rect x="130" y="75" width="70" height="15" rx="3" fill="#e2e8f0" />
    <rect x="130" y="105" width="70" height="15" rx="3" fill="#e2e8f0" />
    <!-- Sink Basin -->
    <ellipse cx="60" cy="50" rx="25" ry="6" fill="#94a3b8" />
    <!-- Faucet -->
    <path d="M 60 50 L 60 30 Q 60 20 50 20" stroke="#94a3b8" stroke-width="4" fill="none" />
  </g>

  <!-- Clinical Wall Art (Center-Right) -->
  <g transform="translate(800, 70)">
    <rect width="60" height="80" fill="#f8fafc" stroke="#94a3b8" stroke-width="4" />
    <path d="M 10 70 C 30 10 30 10 50 70" stroke="#0d9488" stroke-width="3" fill="none" />
    <circle cx="30" cy="35" r="10" fill="#f59e0b" />
  </g>

  <!-- Panorama Text Guide Overlay (Instructions) -->
  <rect x="400" y="380" width="400" height="40" rx="20" fill="rgba(15, 23, 42, 0.75)" />
  <text x="600" y="405" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    DRAG PANORAMA LEFT / RIGHT TO EXPLORE CLINIC
  </text>

</svg>
